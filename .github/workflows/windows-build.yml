name: Build Windows installer

# Compose Desktop's `compose.desktop.currentOs` dependency resolves to
# whatever OS Gradle runs on — the actual reason this has to run on a real
# Windows runner rather than being cross-compiled from Linux. See jpackage's
# own platform requirement: an MSI is built with WiX, a Windows-only tool.
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Not always preinstalled on the runner image; jpackage needs it for
      # the MSI format specifically (not for a plain app-image).
      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build MSI
        run: ./gradlew.bat packageMsi --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: spotlab-desktop-windows
          path: build/compose/binaries/**/msi/*.msi
